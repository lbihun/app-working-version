<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигнали Binance</title>
    <style>
        body {
            width: 320px;
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #f5f5f5;
        }
        h2 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        #filter {
            margin-bottom: 10px;
            width: 100%;
            padding: 5px;
            font-size: 14px;
        }
        .signal-card {
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-in-out;
        }
        .buy {
            border-left: 5px solid #4CAF50;
        }
        .sell {
            border-left: 5px solid #F44336;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
	<h2>Сигнали на Binance Futures</h2>
	<button id="refresh" style="margin-bottom: 10px; width: 100%; padding: 5px;">🔄 Оновити сигнали</button>
	
  <select id="filter">
		<option value="УСІ">Усі</option>
		<option value="BUY">BUY</option>
		<option value="SELL">SELL</option>
	</select>
	
		<div style="margin: 5px 0;">
			<label>
				<input type="checkbox" id="debugToggle" />
				Режим Debug
			</label>
		</div>
		
    <div id="signals-list">Завантаження...</div>
    <script src="popup.js"></script>
</body>
</html>
